<script src="/icons.js"></script>
<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
    }
    .view {
        box-sizing: border-box;
        height: 100%;
    }
    .muted {
        opacity: 0.6;
    }

    /* Kompakte Ansicht: nächste Weckzeit */
    .compact {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 4px;
        gap: 2px;
    }
    .compact .icon {
        font-size: min(14vw, 14vh);
        opacity: 0.7;
    }
    .compact .time {
        font-size: min(26vw, 30vh);
        font-weight: 600;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
    }
    .compact .day {
        font-size: min(11vw, 12vh);
    }

    /* Einstellungsansicht; Schwelle aus den gemessenen Kachelgrößen (Desktop maximiert ca. 627 x 468,
       Handy maximiert ca. 387 x 811, große Rasterkachel 468 x 468 bleibt kompakt) */
    .settings {
        display: none;
        overflow-y: auto;
        padding: 12px 16px;
    }
    @media (min-width: 500px) and (min-height: 400px), (min-width: 340px) and (min-height: 600px) {
        .compact {
            display: none;
        }
        .settings {
            display: block;
        }
    }
    .section {
        margin-bottom: 16px;
    }
    .caption {
        font-size: 0.85em;
        opacity: 0.7;
        margin-bottom: 6px;
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .next {
        font-size: 1.1em;
        font-weight: 600;
    }
    .warning {
        margin-top: 6px;
    }
    .warning:empty {
        display: none;
    }
    label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    input[type="checkbox"] {
        width: 1.2em;
        height: 1.2em;
        margin: 0;
        accent-color: currentColor;
    }
    input[type="time"], input[type="number"] {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        padding: 4px 8px;
    }
    input[type="time"] {
        font-size: 1.6em;
        font-variant-numeric: tabular-nums;
    }
    input[type="number"] {
        width: 5em;
        text-align: right;
    }
    .days {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    .days button {
        font: inherit;
        color: inherit;
        min-width: 2.8em;
        padding: 6px 4px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        background: transparent;
        opacity: 0.6;
        cursor: pointer;
    }
    .days button.on {
        background: rgba(128, 128, 128, 0.35);
        font-weight: 600;
        opacity: 1;
    }
    .days button:disabled {
        cursor: default;
    }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
    }
    .row label {
        flex: 1;
        min-width: 0;
    }
    .row .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .offset {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }
</style>

<div class="view compact">
    <i class="fa-light fa-alarm-clock icon"></i>
    <div class="time" id="compactTime">--:--</div>
    <div class="day" id="compactDay"></div>
</div>

<div class="view settings">
    <div class="section">
        <div class="header">
            <div class="next" id="next"></div>
            <label>
                <input type="checkbox" id="active">
                <span>Alarm clock active</span>
            </label>
        </div>
        <div class="warning" id="warning"></div>
    </div>
    <div class="section">
        <div class="caption">Wake-up time</div>
        <input type="time" id="time">
    </div>
    <div class="section">
        <div class="caption">Active weekdays</div>
        <div class="days" id="days"></div>
    </div>
    <div class="section muted" id="hint"></div>
    <div id="groups"></div>
</div>

<script>
    // Schlüssel entsprechen den ISO-Wochentagen bzw. Gruppenschlüsseln im Modul; Texte werden über locale.json übersetzt.
    const WEEKDAYS = { 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat', 7: 'Sun' };
    const GROUPS = { light: 'Lights', shutter: 'Shutters', heating: 'Heating', other: 'Other', script: 'Scripts' };
    const STATUS = {
        201: 'The wake-up time is invalid',
        202: 'No weekday is enabled',
        203: 'The action selection cannot be read',
        204: 'The central actions are not available',
        205: 'The weekdays cannot be read'
    };
    const HINTS = {
        noInstance: 'No central actions are selected in the configuration of the alarm clock.',
        catalog: 'The central actions are not available. The current selection is kept.',
        selection: 'The saved action selection cannot be read and will not be overwritten.'
    };

    let state = null;
    // Eingaben, die gerade bearbeitet werden, nicht durch eintreffende Aktualisierungen überschreiben.
    let deferred = false;

    function handleMessage(data) {
        state = JSON.parse(data);
        render();
    }

    function send(ident, value) {
        requestAction(ident, JSON.stringify(value));
    }

    function isEditing(container) {
        const element = document.activeElement;
        return element !== null && element.tagName === 'INPUT' && element.type !== 'checkbox' && container.contains(element);
    }

    function dayText(next) {
        if (next.days === 0) {
            return translate('Today');
        }
        if (next.days === 1) {
            return translate('Tomorrow');
        }
        return translate(WEEKDAYS[next.weekday]);
    }

    function statusText() {
        if (!state.active) {
            return translate('Off');
        }
        return STATUS[state.status] ? translate(STATUS[state.status]) : translate('No next wake-up');
    }

    function render() {
        if (state === null) {
            return;
        }
        deferred = false;

        const compactTime = document.getElementById('compactTime');
        const compactDay = document.getElementById('compactDay');
        if (state.active && state.next) {
            compactTime.textContent = state.next.time;
            compactTime.classList.remove('muted');
            compactDay.textContent = dayText(state.next);
        } else {
            compactTime.textContent = state.time || '--:--';
            compactTime.classList.add('muted');
            compactDay.textContent = statusText();
        }

        document.getElementById('next').textContent = state.active && state.next
            ? translate('Next wake-up') + ': ' + dayText(state.next) + ', ' + state.next.time
            : (state.active ? translate('No next wake-up') : translate('Alarm clock is inactive'));
        document.getElementById('warning').textContent = state.active && STATUS[state.status] ? translate(STATUS[state.status]) : '';
        document.getElementById('active').checked = state.active;

        const time = document.getElementById('time');
        if (document.activeElement === time) {
            deferred = true;
        } else {
            time.value = state.time || '';
        }

        renderDays();

        const groups = document.getElementById('groups');
        if (isEditing(groups)) {
            deferred = true;
        } else {
            renderGroups(groups);
        }
        document.getElementById('hint').textContent = state.hint ? translate(HINTS[state.hint])
            : (state.groups.length === 0 ? translate('No central actions available.') : '');
    }

    function renderDays() {
        const days = document.getElementById('days');
        if (days.children.length === 0) {
            for (const day in WEEKDAYS) {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = translate(WEEKDAYS[day]);
                button.addEventListener('click', function () {
                    send('SetWeekday', { Day: Number(day), Active: !button.classList.contains('on') });
                });
                days.appendChild(button);
            }
        }
        for (const button of days.children) {
            const day = Array.prototype.indexOf.call(days.children, button) + 1;
            button.disabled = state.weekdays === null;
            button.classList.toggle('on', state.weekdays !== null && state.weekdays.includes(day));
        }
    }

    function renderGroups(container) {
        container.replaceChildren();
        for (const group of state.groups) {
            const section = document.createElement('div');
            section.className = 'section';
            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = translate(GROUPS[group.key] || group.key);
            section.appendChild(caption);
            for (const action of group.actions) {
                section.appendChild(renderAction(action));
            }
            container.appendChild(section);
        }
    }

    function renderAction(action) {
        const row = document.createElement('div');
        row.className = 'row';

        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = action.active;
        checkbox.addEventListener('change', function () {
            send('SetAction', { ID: action.id, Active: checkbox.checked });
        });
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = action.name;
        label.append(checkbox, name);
        row.appendChild(label);

        if ('offset' in action) {
            const offset = document.createElement('div');
            offset.className = 'offset';
            const input = document.createElement('input');
            input.type = 'number';
            input.step = '1';
            input.min = String(-state.maxOffset);
            input.max = String(state.maxOffset);
            input.value = String(action.offset);
            input.title = translate('Offset in minutes: negative = before the wake-up time, positive = after');
            input.addEventListener('change', function () {
                const value = Number(input.value);
                if (input.value === '' || !Number.isInteger(value) || Math.abs(value) > state.maxOffset) {
                    input.value = String(action.offset);
                    return;
                }
                send('SetAction', { ID: action.id, Offset: value });
            });
            const unit = document.createElement('span');
            unit.textContent = translate('min');
            offset.append(input, unit);
            row.appendChild(offset);
        }
        return row;
    }

    document.getElementById('active').addEventListener('change', function (event) {
        send('SetActive', event.target.checked);
    });

    document.getElementById('time').addEventListener('change', function (event) {
        const value = event.target.value;
        if (/^\d{2}:\d{2}/.test(value)) {
            requestAction('SetWakeUpTime', value.substring(0, 5));
        }
    });

    // Nach Ende einer Eingabe die zwischenzeitlich eingetroffenen Aktualisierungen anzeigen.
    document.addEventListener('focusout', function () {
        setTimeout(function () {
            if (deferred) {
                render();
            }
        }, 0);
    });
</script>
